<script>
// ================= CANVAS + VIEW ================================================
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
let VW = 0, VH = 0, SC = 1, OX = 0, OY = 0;
function fit() {
  VW = window.innerWidth; VH = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SC = VW / CFG.W;            // fill width; vertical center
  OX = 0;
  OY = Math.max(0, (VH - CFG.H * SC) / 2);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - OX) / SC, y: (e.clientY - r.top - OY) / SC };
}
// ================= GAME STATE ==================================================
const ST = { TITLE: 0, PLAY: 1, ROUNDCLEAR: 2, GAMEOVER: 3, INITIALS: 4 };
const G = {
  st: ST.TITLE, score: 0, hi: +(localStorage.getItem('bj_hi') || 0),
  initials: localStorage.getItem('bj_init') || 'AAA',
  lives: CFG.LIVES, round: 1, screenIdx: 0, mult: 1,
  nextLifeAt: CFG.EXTRA_AT, freeze: 0, touchKill: 0,
  litCount: 0, litThisRound: 0, bombsGot: 0, litBonusNext: 10000,
  meter: 0, spawnT: 150, elapsed: 0, deadT: 0, clearT: 0,
  bombs: [], enemies: [], coins: [], powerups: [], pops: [],
  plat: [], platTop: new Map(),
  keys: {}, jumpHeld: false, jumpQueued: 0, glide: false,
  steerX: 0, steerY: 0,
  stick: null,
  msg: '', msgT: 0, shake: 0,
  initSlot: 0, initFilled: false,
};
const P = { x: 70, y: CFG.GROUND_Y - CFG.PLAYER_H, vy: 0, vx: 0, face: 1,
  grounded: true, jumping: false, glide: false, dead: false, invuln: 90, anim: 0 };
function rectHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function setScreen(idx) {
  const s = SCREENS[idx];
  G.screenIdx = idx;
  G.plat = s.platforms.map(p => ({ x: p[0], y: p[1], w: p[2] }));
  G.platTop = new Map();
  for (const pl of G.plat) for (let i = 0; i < pl.w; i++) G.platTop.set(pl.x + i, pl.y);
  G.bombs = s.bombs.map(b => ({ x: b[0], y: b[1], lit: false, pat: Math.random() * 6.28, got: false }));
  G.bombsGot = 0; G.litThisRound = 0; G.litCount = 0; G.litBonusNext = 10000;
  G.meter = 0; G.spawnT = Math.max(50, 170 - idx * 20); G.elapsed = 0; G.freeze = 0; G.touchKill = 0;
  G.enemies = []; G.coins = []; G.powerups = []; G.pops = [];
  P.x = 70; P.y = CFG.GROUND_Y - CFG.PLAYER_H; P.vx = 0; P.vy = 0;
  P.grounded = true; P.dead = false; P.jumping = false; P.glide = false; P.invuln = 60; P.face = 1;
  G.steerX = 0; G.steerY = 0; G.jumpHeld = false; G.jumpQueued = 0; G.glide = false;
  G.initSlot = 0; G.initFilled = false;

const BG_IMGS = {};
function loadBGImages() {
  for (const s of SCREENS) {

function drawBG(s, t) {
  const g = cx;
  const im = BG_IMGS[s.name];
  if (im) {
    g.drawImage(im, 0, 0, CFG.W, CFG.H);
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.fillRect(0, 0, CFG.W, CFG.H);
  } else {
    const grad = g.createLinearGradient(0, 0, 0, CFG.GROUND_Y);
    grad.addColorStop(0, s.sky);
    grad.addColorStop(1, s.sky2);
    g.fillStyle = grad;
    g.fillRect(0, 0, CFG.W, CFG.GROUND_Y);
  }
  if (s.name === 'GREEK') { drawMummy(28, 190, t); drawMummy(100, 190, t); }
  if (s.name === 'CASTLE') { drawMummy(40, 190, t); drawMummy(110, 190, t); }
  // ground
  g.fillStyle = s.ground;
  g.fillRect(0, CFG.GROUND_Y, CFG.W, CFG.H - CFG.GROUND_Y);
  g.fillStyle = '#00000030';
  g.fillRect(0, CFG.GROUND_Y, CFG.W, 2);

<script>
// ================= HUD =========================================================
function txt(g, s, x, y, col, size) {
  g.fillStyle = col; g.font = 'bold ' + (size || 8) + 'px monospace';

}
function drawHUD() {
  const g = cx;
  // top bar
  g.fillStyle = '#00000080'; g.fillRect(0, 0, CFG.W, 18);
  const sc = String(G.score).padStart(6, '0');
  g.font = 'bold 10px monospace';
  g.fillStyle = '#f0f040';
  g.fillText(sc, (CFG.W - g.measureText(sc).width) / 2, 12);
  // lives (left, small mouse icons)
  for (let i = 0; i < Math.min(G.lives, 5); i++) g.drawImage(SPR.jack0, 4 + i * 12, 3, 8, 12);
  // round (right) + bombs left
  txt(g, 'R' + G.round, CFG.W - 30, 12, '#fff', 9);
  txt(g, (G.bombs.length - G.bombsGot) + 'b', CFG.W - 12, 12, '#f04040', 9);
  // bottom bar
  g.fillStyle = '#00000080'; g.fillRect(0, CFG.H - 14, CFG.W, 14);
  txt(g, 'HI ' + String(Math.max(G.hi, G.score)).padStart(6, '0'), 4, CFG.H - 4, '#f0f040', 7);
  txt(g, 'x' + G.mult, 70, CFG.H - 4, '#fff', 7);
  if (G.freeze > 0) txt(g, 'FREEZE', 92, CFG.H - 4, '#40f0f0', 7);
  else if (G.touchKill > 0) txt(g, 'TOUCH KILL', 86, CFG.H - 4, '#ff40ff', 7);
  if (G.msgT > 0) {
    g.font = 'bold 12px monospace';
    g.fillStyle = '#fff';
    g.fillText(G.msg, (CFG.W - g.measureText(G.msg).width) / 2, 70);
    G.msgT--;
  }
}
function drawPlayer() {
  if (P.dead) {
    const t = 90 - G.deadT;
    const ang = t * 0.4;
    const bounce = Math.abs(Math.sin(t * 0.3)) * -10;
    const y = P.y + bounce + Math.min(0, (t - 40) * 0.4);
    const alpha = Math.max(0, 1 - t / 90);
    cx.save();
    cx.globalAlpha = alpha;
    cx.translate(P.x + CFG.PLAYER_W / 2, y + CFG.PLAYER_H / 2);
    cx.rotate(ang);
    cx.scale(P.face, 1);
    cx.drawImage(SPR.jack2, -CFG.PLAYER_W / 2, -CFG.PLAYER_H / 2, CFG.PLAYER_W, CFG.PLAYER_H);
    cx.restore();
    return;
  }
  if (P.invuln > 0 && Math.floor(P.invuln / 4) % 2) return;
  let pose = 0;
  if (!P.grounded) pose = P.vy < 0 ? 2 : 1;
  if (P.glide || (!P.grounded && P.vy > 0 && (G.jumpHeld || IN.sy < -0.3))) pose = 3;
  const spr = SPR['jack' + pose];
  if (P.face < 0) { cx.save(); cx.translate(P.x + CFG.PLAYER_W, 0); cx.scale(-1, 1); cx.drawImage(spr, 0, P.y, CFG.PLAYER_W, CFG.PLAYER_H); cx.restore(); }
  else cx.drawImage(spr, P.x, P.y, CFG.PLAYER_W, CFG.PLAYER_H);
}

  drawBG(SCREENS[G.screenIdx], G.elapsed);
  for (const b of G.bombs) if (!b.got) g.drawImage(SPR[b.lit ? 'bomb1' : 'bomb0'], b.x - 5, b.y - 5, 10, 10);
  for (const c of G.coins) g.drawImage(SPR.coin, c.x - 4, c.y - 4, 8, 8);
  for (const pu of G.powerups) {
    g.drawImage(SPR.hex, pu.x - 7, pu.y - 7, 14, 14);
    txt(g, pu.L, pu.x - 3, pu.y + 4, '#f0f040', 9);

    const spr = e.coin ? SPR.coin : SPR[e.type];
    g.drawImage(spr, e.x - 8, e.y - 8, 16, 16);

// ================= INITIALS (tap wheel) ========================================
const INIT_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const INIT_COLS = 13, INIT_ROWS = 2;
function initGrid() {
  // returns { x0, y0, cw, ch } in logical px
  return { x0: (CFG.W - INIT_COLS * 10) / 2, y0: 150, cw: 10, ch: 10 };
}
function handleInitialsTap(e) {
  const l = toLogical(e);
  const gr = initGrid();
  if (l.x >= gr.x0 && l.x < gr.x0 + INIT_COLS * gr.cw && l.y >= gr.y0 && l.y < gr.y0 + INIT_ROWS * gr.ch) {
    const col = Math.floor((l.x - gr.x0) / gr.cw);
    const row = Math.floor((l.y - gr.y0) / gr.ch);
    if (col >= 0 && col < INIT_COLS && row >= 0 && row < INIT_ROWS) {
      const idx = row * INIT_COLS + col;
      if (G.initSlot < 3) {
        G.initials = G.initials.slice(0, G.initSlot) + INIT_LETTERS[idx] + G.initials.slice(G.initSlot + 1);
        G.initSlot++;
        if (G.initSlot >= 3) G.initFilled = true;
        localStorage.setItem('bj_init', G.initials);
        beep(500 + idx * 8, 0.05);
        haptic('light');
      }
    }
  } else if (G.initFilled && l.y > gr.y0 + INIT_ROWS * gr.ch + 30) {
    G.st = ST.GAMEOVER;
  }
}

  if (!AC) return;
  const t0 = AC.currentTime + 0.02;
  const o = AC.createOscillator(); o.type = 'square';
  const gn = AC.createGain();
  // bumpy descending steps: 880 → 660 → 520 → 400, each ~0.28s
  o.frequency.setValueAtTime(880, t0);
  o.frequency.setValueAtTime(660, t0 + 0.28);
  o.frequency.setValueAtTime(520, t0 + 0.56);
  o.frequency.setValueAtTime(400, t0 + 0.84);
  // then the long sad slide down to a squeak
  o.frequency.exponentialRampToValueAtTime(55, t0 + 1.5);

  const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 7;

  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(0.08, t0 + 0.03);
  gn.gain.setValueAtTime(0.08, t0 + 1.05);
  gn.gain.exponentialRampToValueAtTime(0.001, t0 + 1.5);

function musNote(f, t, dur, type, vol) {

function musicStart() {

  if (!AC) return;
  musNextT = AC.currentTime + 0.05;
  if (musTimer) clearInterval(musTimer);
  musTimer = setInterval(() => {
    if (!musicOn || !AC) return;
    const th = M_TH[SCREENS[G.screenIdx] ? SCREENS[G.screenIdx].name : 'PYRAMID'];
    const sd = 60 / th.bpm / 4;
    while (musNextT < AC.currentTime + 0.12) {
      const s = musStep % 128;
      const m = th.mel[s];
      if (m) musNote(m, musNextT, sd * 0.9, th.lead || 'square', th.lead ? 0.035 : 0.026);
      const b = th.bas[s];
      if (b) musNote(b, musNextT, sd * 1.8, 'triangle', 0.05);

      if (p) musDrum(p, musNextT, sd);

}

  } else if (G.st === ST.PLAY) {
    G.elapsed++;
    if (G.shake > 0) G.shake--;
    playerStep();

    coinStep();
    enemyStep();
    for (const p of G.pops) { p.y -= 0.4; p.t--; }
    G.pops = G.pops.filter(p => p.t > 0);
    if (P.dead) {
      G.deadT--;
      if (G.deadT <= 0) {
        G.lives--;
        if (G.lives < 0) {
          musicStop();
          if (G.score > G.hi) { G.hi = G.score; localStorage.setItem('bj_hi', G.hi); G.st = ST.INITIALS; }

  }

      }
    }
    if (G.initFilled) {
      const blink = Math.floor(performance.now() / 500) % 2;
      if (blink) { cx.font = 'bold 9px monospace'; cx.fillStyle = '#f0f040';
        cx.fillText('TAP TO CONTINUE', (CFG.W - cx.measureText('TAP TO CONTINUE').width) / 2, 230); }
    }
    cx.restore();
    return;
  }
  drawWorld();
  cx.restore();
}
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 100) dt = 100;
  acc += dt;
  const step = 1000 / 60;
  while (acc >= step) { tick(); acc -= step; }
  render();
}
// ================= TELEGRAM + BOOT =============================================
function tgInit() {
  try {
    const W = Telegram && Telegram.WebApp;
    if (!W) return;
    W.ready(); W.expand();
    W.setHeaderColor('#101040'); W.setBackgroundColor('#101040');
    W.disableVerticalSwipes();   // block Telegram page slide-down/minimize gestures
    // no MainButton — game is started by tapping the screen
  } catch (e) {}
}
window.addEventListener('load', () => {
  buildSprites();
  loadBGImages();
  fit();
  tgInit();
  requestAnimationFrame(frame);
});
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
