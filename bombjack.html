<style>

<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ================= CONFIG (tunables) =================
const CFG = {
  W: 144, H: 256,          // logical playfield, 9:16 vertical
  FRAME: 0,                // no bezel — full screen
  GRAV: 0.15,
  RUN: 2.3,                // px/frame at full steer
  JUMP_V: 3.6,             // jump reaches ~40px
  JUMP_HOLD: 0.055,        // extra up-accel while jump held & ascending
  JUMP_CUT: 0.42,          // vy multiplier on early release
  GLIDE_V: 0.55,           // fall speed while gliding
  FAST_FALL: 0.6,          // extra fall accel steering down
  DEAD_PX: 12, FULL_PX: 40,
  LIVES: 3, EXTRA_AT: 50000,
  LIT_EVERY: 100,          // frames between bombs lighting after 1st pickup
  BOMB_PATROL: 7,          // lit (black) bomb patrol radius; red bombs are FIXED
  PLAYER_W: 10, PLAYER_H: 16,
  GROUND_Y: 238,           // walkable ground top (near bottom)
};
// Screen order: 1=pyramid 2=greek 3=castle 4=skyscraper 5=night(no platforms)
// coords: logical px within CFG.W x CFG.H; bombs = [x,y] (24 per screen)
// 24 bombs spread across full height (y ~20..230); platforms 3-5 high, ~35px reachable
const SCREENS = [
  { name:'PYRAMID', sky:'#1a2a6c', sky2:'#f0a030', plat:'#e0c060', ground:'#b08830',
    platforms:[[14,196,40],[90,196,40],[28,158,40],[76,158,40],[52,120,40]],
    bombs:[[14,230],[40,226],[66,226],[92,226],[118,230],[24,200],[52,200],[80,200],[108,200],[134,200],
           [14,162],[44,162],[72,162],[100,162],[128,162],[30,124],[60,124],[90,124],[118,124],
           [22,86],[50,86],[78,86],[106,86],[134,86]] },
  { name:'GREEK', sky:'#4a2060', sky2:'#f06030', plat:'#d8d0c0', ground:'#a07030',
    platforms:[[10,196,34],[65,196,34],[120,196,14],[24,158,34],[79,158,34],[52,120,40]],
    bombs:[[14,230],[40,230],[66,230],[92,230],[118,230],[24,200],[52,200],[80,200],[108,200],[134,200],
           [14,162],[44,162],[72,162],[100,162],[128,162],[30,124],[60,124],[90,124],[118,124],
           [22,86],[50,86],[78,86],[106,86],[134,86]] },
  { name:'CASTLE', sky:'#302060', sky2:'#6040a0', plat:'#7060a0', ground:'#403060',
    platforms:[[10,196,40],[94,196,40],[28,158,40],[76,158,40],[52,120,40]],
    bombs:[[14,230],[40,230],[66,230],[92,230],[118,230],[24,200],[52,200],[80,200],[108,200],[134,200],
           [14,162],[44,162],[72,162],[100,162],[128,162],[30,124],[60,124],[90,124],[118,124],
           [22,86],[50,86],[78,86],[106,86],[134,86]] },
  { name:'SKYSCRAPER', sky:'#102040', sky2:'#2040a0', plat:'#405080', ground:'#203060',
    platforms:[[10,196,40],[94,196,40],[28,158,40],[76,158,40],[52,120,40]],
    bombs:[[14,230],[40,230],[66,230],[92,230],[118,230],[24,200],[52,200],[80,200],[108,200],[134,200],
           [14,162],[44,162],[72,162],[100,162],[128,162],[30,124],[60,124],[90,124],[118,124],
           [22,86],[50,86],[78,86],[106,86],[134,86]] },
  { name:'NIGHT', sky:'#050510', sky2:'#101030', plat:'#203060', ground:'#181830',
    platforms:[],
    bombs:[[14,230],[40,230],[66,230],[92,230],[118,230],[24,200],[52,200],[80,200],[108,200],[134,200],
           [14,162],[44,162],[72,162],[100,162],[128,162],[30,124],[60,124],[90,124],[118,124],
           [22,86],[50,86],[78,86],[106,86],[134,86]] },
];

<script>
// ================= CANVAS + VIEW ================================================
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
let VW = 0, VH = 0, SC = 1, OX = 0, OY = 0;
function fit() {
  VW = window.innerWidth; VH = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SC = VW / CFG.W;            // fill width; vertical center
  OX = 0;
  OY = Math.max(0, (VH - CFG.H * SC) / 2);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - OX) / SC, y: (e.clientY - r.top - OY) / SC };
}
// ================= GAME STATE ==================================================
const ST = { TITLE: 0, PLAY: 1, ROUNDCLEAR: 2, GAMEOVER: 3, INITIALS: 4 };
const G = {
  st: ST.TITLE, score: 0, hi: +(localStorage.getItem('bj_hi') || 0),
  initials: localStorage.getItem('bj_init') || 'AAA',
  lives: CFG.LIVES, round: 1, screenIdx: 0, mult: 1,
  nextLifeAt: CFG.EXTRA_AT, freeze: 0, touchKill: 0,
  litCount: 0, litThisRound: 0, bombsGot: 0, litBonusNext: 10000,
  meter: 0, spawnT: 150, elapsed: 0, deadT: 0, clearT: 0,
  bombs: [], enemies: [], coins: [], powerups: [], pops: [],
  plat: [], platTop: new Map(),
  keys: {}, jumpHeld: false, jumpQueued: 0, glide: false,
  steerX: 0, steerY: 0,
  stick: null,
  msg: '', msgT: 0, shake: 0,
  initSlot: 0, initFilled: false,
};
const P = { x: 70, y: CFG.GROUND_Y - CFG.PLAYER_H, vy: 0, vx: 0, face: 1,
  grounded: true, jumping: false, glide: false, dead: false, invuln: 90, anim: 0 };
function rectHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function setScreen(idx) {
  const s = SCREENS[idx];
  G.screenIdx = idx;
  G.plat = s.platforms.map(p => ({ x: p[0], y: p[1], w: p[2] }));
  G.platTop = new Map();
  for (const pl of G.plat) for (let i = 0; i < pl.w; i++) G.platTop.set(pl.x + i, pl.y);
  G.bombs = s.bombs.map(b => ({ x: b[0], y: b[1], lit: false, pat: Math.random() * 6.28, got: false }));
  G.bombsGot = 0; G.litThisRound = 0; G.litCount = 0; G.litBonusNext = 10000;
  G.meter = 0; G.spawnT = Math.max(50, 170 - idx * 20); G.elapsed = 0; G.freeze = 0; G.touchKill = 0;
  G.enemies = []; G.coins = []; G.powerups = []; G.pops = [];
  P.x = 70; P.y = CFG.GROUND_Y - CFG.PLAYER_H; P.vx = 0; P.vy = 0;
  P.grounded = true; P.dead = false; P.jumping = false; P.glide = false; P.invuln = 60; P.face = 1;
  G.steerX = 0; G.steerY = 0; G.jumpHeld = false; G.jumpQueued = 0; G.glide = false;
  G.initSlot = 0; G.initFilled = false;
}
function addPop(x, y, txt, col) { G.pops.push({ x, y, txt, col: col || '#fff', t: 45 }); }
function newGame() {
  G.score = 0; G.lives = CFG.LIVES; G.round = 1; G.mult = 1; G.nextLifeAt = CFG.EXTRA_AT;
  G.st = ST.PLAY; setScreen(0);
  musicStart();
}
function addScore(n) {
  G.score += n;
  while (G.score >= G.nextLifeAt) { G.nextLifeAt += CFG.EXTRA_AT; G.lives++; addPop(P.x, P.y - 8, '1UP', '#40ff40'); }
}
// ================= INPUT (single-finger: steer + jump) ===========================
const IN = { sx: 0, sy: 0, jump: false, jumpQ: 0 };
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  const st = G.st;
  if (st === ST.TITLE) { G.jumpQueued++; return; }
  if (st === ST.GAMEOVER) { G.jumpQueued++; return; }
  if (st === ST.INITIALS) { handleInitialsTap(e); return; }
  // PLAY: single finger = virtual stick + jump
  G.stick = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
  G.jumpHeld = true;
  G.jumpQueued++;
});
cv.addEventListener('pointermove', e => {
  if (G.stick && e.pointerId === G.stick.id) {
    let dx = e.clientX - G.stick.sx, dy = e.clientY - G.stick.sy;
    const m = Math.hypot(dx, dy);
    if (m > 80) { dx = dx / m * 80; dy = dy / m * 80; }
    G.stick.dx = dx; G.stick.dy = dy;
  }
});
function ptrUp(e) {
  if (G.stick && e.pointerId === G.stick.id) G.stick = null;
  G.jumpHeld = false;
}
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  G.keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space') { G.jumpHeld = true; G.jumpQueued++; }
  if (e.code === 'Enter' && (G.st === ST.TITLE || G.st === ST.GAMEOVER)) G.jumpQueued++;
});
window.addEventListener('keyup', e => {
  G.keys[e.code] = false;
  if (e.code === 'Space') G.jumpHeld = false;
});
function sampleInput() {
  let sx = 0, sy = 0;
  if (G.stick) {
    const d = G.stick.dx;
    sx = Math.abs(d) < CFG.DEAD_PX ? 0 : Math.max(-1, Math.min(1, (d - Math.sign(d) * CFG.DEAD_PX) / (CFG.FULL_PX - CFG.DEAD_PX)));
    const v = G.stick.dy;
    sy = Math.abs(v) < CFG.DEAD_PX ? 0 : Math.max(-1, Math.min(1, (v - Math.sign(v) * CFG.DEAD_PX) / (CFG.FULL_PX - CFG.DEAD_PX)));
  }
  if (G.keys['ArrowLeft']) sx = Math.min(sx, -1);
  if (G.keys['ArrowRight']) sx = Math.max(sx, 1);
  if (G.keys['ArrowUp']) sy = Math.min(sy, -1);
  if (G.keys['ArrowDown']) sy = Math.max(sy, 1);
  IN.sx = sx; IN.sy = sy;
}
// ================= PLAYER PHYSICS ==============================================
function playerStep() {
  if (P.dead) return;
  const target = IN.sx * CFG.RUN;
  P.vx += (target - P.vx) * (P.grounded ? 0.5 : 0.22);
  if (Math.abs(P.vx) > 0.05) P.face = P.vx > 0 ? 1 : -1;
  P.anim += Math.abs(P.vx) * 0.22;
  if (G.jumpQueued > 0) {
    G.jumpQueued = 0;
    if (P.grounded) {
      P.vy = -CFG.JUMP_V; P.grounded = false; P.jumping = true; P.glide = false;
      addScore(10);
    } else if (P.vy > -1.2) { P.glide = true; }
  }
  if (!P.grounded) {
    P.vy += CFG.GRAV;
    if (P.vy < 0 && G.jumpHeld) P.vy -= CFG.JUMP_HOLD;
    if (P.vy > 0 && G.jumpHeld && !P.glide) P.vy *= CFG.JUMP_CUT;
    if (P.vy > 0 && (P.glide || IN.sy < -0.3)) P.vy = Math.min(P.vy, CFG.GLIDE_V);
    if (P.vy > 0 && IN.sy > 0.5) P.vy += CFG.FAST_FALL;
    if (P.vy > 5) P.vy = 5;
  }
  P.x += P.vx;
  if (P.x < 2) { P.x = 2; P.vx = 0; }
  if (P.x + CFG.PLAYER_W > CFG.W - 2) { P.x = CFG.W - 2 - CFG.PLAYER_W; P.vx = 0; }
  const prevBottom = P.y + CFG.PLAYER_H;
  P.y += P.vy;
  P.grounded = false; P.glide = false;
  if (P.vy >= 0) {
    if (prevBottom <= CFG.GROUND_Y + 1 && P.y + CFG.PLAYER_H >= CFG.GROUND_Y) {
      P.y = CFG.GROUND_Y - CFG.PLAYER_H; P.vy = 0; P.grounded = true; P.jumping = false;
    } else {
      for (const pl of G.plat) {
        const top = P.y + CFG.PLAYER_H;
        if (P.x + CFG.PLAYER_W - 2 > pl.x && P.x + 2 < pl.x + pl.w &&
            prevBottom <= pl.y + 1 && top >= pl.y) {
          P.y = pl.y - CFG.PLAYER_H; P.vy = 0; P.grounded = true; P.jumping = false;
          break;
        }
      }
    }
  }
  if (P.invuln > 0) P.invuln--;
}
function playerDie() {
  if (P.invuln > 0 || P.dead) return;
  P.dead = true; G.deadT = 90; G.shake = 8;
  haptic('heavy');
}
function respawn() {
  P.x = 70; P.y = CFG.GROUND_Y - CFG.PLAYER_H;
  P.vx = 0; P.vy = 0; P.dead = false; P.grounded = true; P.invuln = 120;
}
</script>
<script>
// ================= BOMBS =======================================================
const LIT_MOVERS = 2;
function bombStep() {
  const active = G.bombs.filter(b => !b.got);
  if (G.bombsGot > 0) {
    G.litTimer = (G.litTimer || 0) + 1;
    if (G.litTimer >= 45) {
      G.litTimer = 0;
      for (const b of active) { if (!b.lit) { b.lit = true; break; } }
    }
  }
  const litActive = active.filter(b => b.lit);
  for (const b of litActive) b.mover = false;
  for (let i = Math.max(0, litActive.length - LIT_MOVERS); i < litActive.length; i++) litActive[i].mover = true;
  for (const b of active) {
    if (b.lit && b.mover) {
      b.pat = (b.pat || 0) + 0.012;
      b.x += Math.cos(b.pat) * 0.035;
    }
  }
  const pb = { x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H };
  for (const b of G.bombs) {
    if (b.got) continue;
    if (rectHit(pb, { x: b.x - 5, y: b.y - 5, w: 10, h: 10 })) {
      b.got = true; G.bombsGot++;
      const pts = (b.lit ? 200 : 100) * G.mult;
      addScore(pts);
      addPop(b.x, b.y, '' + pts, b.lit ? '#000' : '#f04040');
      G.meter += b.lit ? 2 : 1;
      if (b.lit) { G.litThisRound++; }
      if (G.meter >= 10) { G.meter = 0; spawnPowerup(); }
      haptic('light');
    }
  }
  if (G.st === ST.PLAY && G.bombsGot >= 24) roundClear();
}
function roundClear() {
  let bonus = 0;
  if (G.litThisRound === 20) bonus = 10000;
  else if (G.litThisRound === 21) bonus = 20000;
  else if (G.litThisRound === 22) bonus = 30000;
  else if (G.litThisRound >= 23) bonus = 50000;
  addScore(bonus);
  G.st = ST.ROUNDCLEAR; G.clearT = 120;
  haptic('success');
}
// ================= POWERUPS ====================================================
function spawnPowerup() {
  const r = Math.random();
  const L = r < 0.34 ? 'P' : r < 0.62 ? 'B' : r < 0.86 ? 'E' : 'S';
  G.powerups.push({ x: 6 + Math.random() * (CFG.W - 12), y: 30 + Math.random() * 70, L, vx: 0.35, t: 0 });
}
function powerupStep() {
  for (const pu of G.powerups) {
    pu.t++; pu.x += pu.vx;
    if (pu.x > CFG.W - 8) { pu.x = CFG.W - 8; pu.vx *= -1; }
    if (pu.x < 8) { pu.x = 8; pu.vx *= -1; }
    if (pu.y < 28) pu.y = 28;
    if (pu.y > CFG.GROUND_Y - 8) pu.y = CFG.GROUND_Y - 8;
    if (pu.t > 900) pu.dead = true;
    if (!pu.dead && !P.dead &&
        rectHit({ x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H }, { x: pu.x - 7, y: pu.y - 7, w: 14, h: 14 })) {
      pu.dead = true;
      const pts = 1000 * G.mult;
      addScore(pts);
      addPop(pu.x, pu.y, '' + pts, '#40f0f0');
      if (pu.L === 'P') {
        G.freeze = 300;
        for (const e of G.enemies) if (!e.frozen) { e.frozen = true; e.coin = true; }
      } else if (pu.L === 'B') {
        G.mult = Math.min(5, G.mult + 1);
        addPop(pu.x, pu.y + 10, 'x' + G.mult, '#f0f040');
        for (let i = 0; i < 5; i++) dropCoin(pu.x, pu.y);
      } else if (pu.L === 'E') {
        G.lives++;
        addPop(pu.x, pu.y + 10, '1UP', '#40ff40');
      } else if (pu.L === 'S') {
        G.touchKill = 240;
        addPop(pu.x, pu.y + 10, 'TOUCH KILL', '#ff40ff');
      }
      haptic('medium');
    }
  }
  G.powerups = G.powerups.filter(p => !p.dead);
}
function dropCoin(x, y) {
  const cols = [100, 300, 1000, 2000];
  const col = cols[Math.floor(Math.random() * cols.length)];
  G.coins.push({ x: x + (Math.random() - 0.5) * 24, y, vy: -1 - Math.random(), val: col, t: 0 });
}
function coinStep() {
  for (const c of G.coins) {
    c.t++; c.vy += 0.12; c.y += c.vy;
    if (c.y > CFG.GROUND_Y - 3) { c.y = CFG.GROUND_Y - 3; c.vy = 0; }
    if (c.t > 240) c.dead = true;
    if (!c.dead && !P.dead &&
        rectHit({ x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H }, { x: c.x - 4, y: c.y - 4, w: 8, h: 8 })) {
      c.dead = true;
      const pts = c.val * G.mult;
      addScore(pts);
      addPop(c.x, c.y, '' + pts, '#f0c020');
    }
  }
  G.coins = G.coins.filter(c => !c.dead);
}
// ================= ENEMIES =====================================================
const ETYPES = ['owl', 'cat', 'ghost', 'slime'];
function spawnEnemy() {
  if (G.enemies.length >= 6) return;
  const type = ETYPES[Math.floor(Math.random() * Math.min(2 + G.screenIdx, ETYPES.length))];
  const x = 20 + Math.random() * (CFG.W - 40);
  const speed = 0.4 + G.screenIdx * 0.12 + Math.min(0.4, G.elapsed / 24000);
  G.enemies.push({ type, x, y: -14, vy: 0.6, t: 0, dir: 1, frozen: false, coin: false, speed, phase: Math.random() * 6.28 });
}
function enemyStep() {
  if (G.st === ST.PLAY && G.freeze <= 0) {
    G.spawnT--;
    if (G.spawnT <= 0) {
      spawnEnemy();
      const base = Math.max(35, 120 - G.screenIdx * 18 - Math.floor(G.elapsed / 900) * 5);
      G.spawnT = base + Math.random() * 40;
    }
  }
  for (const e of G.enemies) {
    e.t++;
    if (G.freeze > 0 && e.coin) {
      e.y += 0.5;
      if (e.y > CFG.GROUND_Y - 4) e.y = CFG.GROUND_Y - 4;
      if (rectHit({ x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H }, { x: e.x - 6, y: e.y - 6, w: 12, h: 12 })) {
        e.dead = true;
        addScore(300 * G.mult);
        addPop(e.x, e.y, '' + (300 * G.mult), '#f0c020');
        haptic('light');
      }
      continue;
    }
    if (e.type === 'owl') {
      // flies, flaps, drifts toward player x
      if (e.y < 40 + Math.sin(e.t * 0.05) * 8) e.y += e.vy * 0.4;
      e.y += Math.sin(e.t * 0.08 + e.phase) * 0.5;
      e.x += (P.x - e.x) * 0.012 * e.speed;
    } else if (e.type === 'cat') {
      // runs on ground, bounces, chases player x
      if (e.y < CFG.GROUND_Y - 12) e.y += e.vy;
      else {
        e.y = CFG.GROUND_Y - 12 + Math.abs(Math.sin(e.t * 0.25)) * -2;
        e.x += (P.x > e.x ? 1 : -1) * e.speed * 0.8;
      }
    } else if (e.type === 'ghost') {
      // floats, drifts diagonally, semi-transparent
      e.y += (Math.min(P.y - 10, 200) - e.y) * 0.008;
      e.x += (P.x - e.x) * 0.008 + Math.sin(e.t * 0.05 + e.phase) * 0.4;
      e.y += Math.sin(e.t * 0.08 + e.phase) * 0.4;
    } else if (e.type === 'slime') {
      // bounces on ground (parabolic), moves horizontally
      if (e.y < CFG.GROUND_Y - 10) {
        e.y += e.vy;
        if (e.y >= CFG.GROUND_Y - 10) { e.y = CFG.GROUND_Y - 10; e.vy = -2.2; }
      } else { e.vy = -2.2; }
      e.x += e.dir * e.speed * 0.8;
      if (e.x < 10) { e.x = 10; e.dir = 1; }

    y += (size || 12) + 6;
  }
  if (sub) { g.font = 'bold 8px monospace'; g.fillStyle = '#aaa';
    const w = g.measureText(sub).width; g.fillText(sub, (CFG.W - w) / 2, y + 8); }
}
// ================= SOUND (WebAudio bleeps) =====================================
let AC = null;
function audioInit() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function beep(freq, dur, type, vol) {
  if (!AC) return;
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  gn.gain.setValueAtTime(vol || 0.06, AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(gn); gn.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
const N = { C4: 262, D4: 294, E4: 330, F4: 349, G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, G5: 784, A5: 880, C6: 1047 };
const MELODY = [N.E4, N.G4, N.A4, N.G4, N.E4, N.D4, N.C4, N.D4, N.E4, N.G4, N.C5, N.G4, N.A4, N.B4, N.C5, N.D5, N.C5, N.B4, N.A4, N.G4, N.A4, N.G4, N.E4, N.G4, N.E4, N.D4, N.E4, N.D4, N.C4, 0, N.D4, N.E4];
const BASS = [N.C4, 0, 0, 0, N.G4, 0, 0, 0, N.C4, 0, 0, 0, N.A4, 0, 0, 0];
let musicStep = 0, musicOn = false;
function musicStart() { if (AC && !musicOn) musicOn = true; }
function musicStop() { musicOn = false; }
function musicTick() {
  if (!AC || !musicOn || G.st !== ST.PLAY) return;
  const s16 = musicStep % 16;
  const m = MELODY[musicStep % 32];
  if (m) beep(m, 0.09, 'square', 0.028);
  const b = BASS[s16];
  if (b) beep(b / 2, 0.12, 'triangle', 0.05);
  musicStep++;
}
function haptic(kind) {
  try {
    const H = Telegram.WebApp && Telegram.WebApp.HapticFeedback;
    if (!H) return;
    if (kind === 'light') H.impactOccurred('light');
    else if (kind === 'medium') H.impactOccurred('medium');
    else if (kind === 'heavy') H.impactOccurred('heavy');
    else if (kind === 'success') H.notificationOccurred('success');
  } catch (e) {}
}
// ================= MAIN LOOP ===================================================
function tick() {
  sampleInput();
  if (G.st === ST.TITLE) {
    if (G.jumpQueued > 0) { G.jumpQueued = 0; audioInit(); newGame(); beep(880, 0.1); }
  } else if (G.st === ST.PLAY) {
    G.elapsed++;
    if (G.shake > 0) G.shake--;
    playerStep();
    bombStep();
    powerupStep();
    coinStep();
    enemyStep();
    musicTick();
    for (const p of G.pops) { p.y -= 0.4; p.t--; }
    G.pops = G.pops.filter(p => p.t > 0);
    if (P.dead) {
      G.deadT--;
      if (G.deadT <= 0) {
        G.lives--;
        if (G.lives < 0) {
          musicStop();
          if (G.score > G.hi) { G.hi = G.score; localStorage.setItem('bj_hi', G.hi); G.st = ST.INITIALS; }
          else G.st = ST.GAMEOVER;
          haptic('heavy');
        } else respawn();
      }
    }
  } else if (G.st === ST.ROUNDCLEAR) {
    G.clearT--;
    if (G.clearT <= 0) {
      G.round++;
      setScreen(G.round % 5);
      G.st = ST.PLAY;
      G.msg = SCREENS[G.screenIdx].name; G.msgT = 90;
    }
  } else if (G.st === ST.GAMEOVER) {
    if (G.jumpQueued > 0) { G.jumpQueued = 0; G.st = ST.TITLE; }
  } else if (G.st === ST.INITIALS) {
    // handled by tap in handleInitialsTap
  }
}
function render() {
  cx.save();
  if (G.shake > 0) cx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  cx.translate(OX + CFG.FRAME * SC, OY + CFG.FRAME * SC);
  cx.scale(SC, SC);
  if (G.st === ST.TITLE) {
    cx.fillStyle = '#101040'; cx.fillRect(0, 0, CFG.W, CFG.H);
    cx.font = 'bold 28px monospace'; cx.fillStyle = '#f0f040';
    cx.fillText('BOMB JACK', (CFG.W - cx.measureText('BOMB JACK').width) / 2, 50);
    cx.font = 'bold 7px monospace'; cx.fillStyle = '#fff';
    cx.fillText('TEHKAN 1984 — TELEGRAM EDITION', (CFG.W - cx.measureText('TEHKAN 1984 — TELEGRAM EDITION').width) / 2, 62);
    cx.drawImage(SPR.jack0, CFG.W / 2 - 16, 70, 32, 48);
    for (let i = 0; i < 4; i++) cx.drawImage(SPR['bomb' + (i % 2)], CFG.W / 2 - 24 + i * 12, 126, 10, 10);
    const blink = Math.floor(performance.now() / 500) % 2;
    if (blink) { cx.font = 'bold 11px monospace'; cx.fillStyle = '#fff';
      cx.fillText('TAP TO START', (CFG.W - cx.measureText('TAP TO START').width) / 2, 160); }
    cx.font = 'bold 8px monospace'; cx.fillStyle = '#888';
    cx.fillText('HI-SCORE ' + String(G.hi).padStart(6, '0') + '  ' + G.initials, (CFG.W - cx.measureText('HI-SCORE ' + String(G.hi).padStart(6, '0') + '  ' + G.initials).width) / 2, 180);
    cx.restore();
    return;
  }
  if (G.st === ST.ROUNDCLEAR) {
    drawWorld();
    centerPanel([['ROUND CLEAR', '#f0f040', 16], [G.litThisRound + ' LIT BOMBS', '#fff', 10]], 'next: ' + SCREENS[(G.round + 1) % 5].name);
    cx.restore();
    return;
  }
  if (G.st === ST.GAMEOVER) {
    cx.fillStyle = '#100000'; cx.fillRect(0, 0, CFG.W, CFG.H);
    cx.font = 'bold 20px monospace'; cx.fillStyle = '#f03030';
    cx.fillText('GAME OVER', (CFG.W - cx.measureText('GAME OVER').width) / 2, 90);
    cx.font = 'bold 10px monospace'; cx.fillStyle = '#fff';
    cx.fillText('SCORE ' + G.score, (CFG.W - cx.measureText('SCORE ' + G.score).width) / 2, 120);
    if (Math.floor(performance.now() / 500) % 2) {
      cx.font = 'bold 9px monospace'; cx.fillStyle = '#f0f040';
      cx.fillText('TAP TO CONTINUE', (CFG.W - cx.measureText('TAP TO CONTINUE').width) / 2, 160);
    }
    cx.restore();
    return;
  }
  if (G.st === ST.INITIALS) {
    cx.fillStyle = '#100000'; cx.fillRect(0, 0, CFG.W, CFG.H);
    cx.font = 'bold 10px monospace'; cx.fillStyle = '#fff';
    cx.fillText('NEW HIGH SCORE!', (CFG.W - cx.measureText('NEW HIGH SCORE!').width) / 2, 50);
    cx.font = 'bold 12px monospace'; cx.fillStyle = '#f0f040';
    cx.fillText('SCORE ' + G.score, (CFG.W - cx.measureText('SCORE ' + G.score).width) / 2, 70);
    cx.font = 'bold 9px monospace'; cx.fillStyle = '#aaa';
    cx.fillText('ENTER YOUR INITIALS', (CFG.W - cx.measureText('ENTER YOUR INITIALS').width) / 2, 95);
    // 3 slots
    for (let i = 0; i < 3; i++) {
      const sx = CFG.W / 2 - 24 + i * 18;
      cx.fillStyle = '#202020'; cx.fillRect(sx, 105, 16, 18);
      cx.strokeStyle = i === G.initSlot ? '#f0f040' : '#555'; cx.lineWidth = 1;
      cx.strokeRect(sx + 0.5, 105.5, 15, 17);
      cx.font = 'bold 12px monospace'; cx.fillStyle = '#fff';
      cx.fillText(G.initials[i], sx + 5, 119);
    }
    // letter grid
    const gr = initGrid();
    for (let r = 0; r < INIT_ROWS; r++) {
      for (let c = 0; c < INIT_COLS; c++) {
        const idx = r * INIT_COLS + c;
        const x = gr.x0 + c * gr.cw, y = gr.y0 + r * gr.ch;
        cx.fillStyle = '#181818'; cx.fillRect(x, y, gr.cw - 1, gr.ch - 1);
        cx.font = 'bold 8px monospace'; cx.fillStyle = '#ccc';
        cx.fillText(INIT_LETTERS[idx], x + 2, y + 8);
      }
    }
    if (G.initFilled) {
      const blink = Math.floor(performance.now() / 500) % 2;
      if (blink) { cx.font = 'bold 9px monospace'; cx.fillStyle = '#f0f040';
        cx.fillText('TAP TO CONTINUE', (CFG.W - cx.measureText('TAP TO CONTINUE').width) / 2, 230); }
    }
    cx.restore();
    return;
  }
  drawWorld();
  cx.restore();
}
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 100) dt = 100;
  acc += dt;
  const step = 1000 / 60;
  while (acc >= step) { tick(); acc -= step; }
  render();
}
// ================= TELEGRAM + BOOT =============================================
function tgInit() {
  try {
    const W = Telegram && Telegram.WebApp;
    if (!W) return;
    W.ready(); W.expand();
    W.setHeaderColor('#000'); W.setBackgroundColor('#000');
    const MB = W.MainButton;
    if (MB) {
      MB.onClick(() => { audioInit(); if (G.st === ST.TITLE) newGame(); });
      MB.show(); MB.setText('PLAY');
    }
  } catch (e) {}
}
window.addEventListener('load', () => {
  buildSprites();
  fit();
  tgInit();
  requestAnimationFrame(frame);
});
</script>
