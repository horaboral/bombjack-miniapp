<script>
"use strict";
// ================= CONFIG (tunables; tuned vs arcade longplay TKzYmjnNbcA) ============
const CFG = {
  W: 256, H: 192,          // logical playfield (inside bezel), 4:3
  FRAME: 8,                // bezel thickness
  GRAV: 0.15,
  RUN: 2.3,                // px/frame at full steer
  JUMP_V: 3.6,             // taller jump (user: barely reached upper platform)
  JUMP_HOLD: 0.055,        // extra up-accel while jump held & ascending
  JUMP_CUT: 0.42,          // vy multiplier on early release
  GLIDE_V: 0.55,           // fall speed while gliding
  FAST_FALL: 0.6,          // extra fall accel steering down
  DEAD_PX: 12, FULL_PX: 40,
  LIVES: 3, EXTRA_AT: 50000,
  LIT_EVERY: 100,          // frames between bombs lighting after 1st pickup
  BOMB_PATROL: 7,          // lit (black) bomb patrol radius; red bombs are FIXED
  PLAYER_W: 8, PLAYER_H: 13,
  GROUND_Y: 176,           // walkable grass/hedge top
};
// Screen order = longplay round order: 1=pyramid 2=greek 3=castle 4=skyscraper 5=night(no platforms)
// coords: logical px within CFG.W x CFG.H; bombs = [x,y] (24 per screen)
const SCREENS = [
 { name:'PYRAMID', sky:'#2030d0', bezel:'#e0c020', plat:'#e0c020', ground:'#c0a020',
   platforms:[[60,52,80],[110,96,70],[28,132,58],[96,156,64]],
   bombs:[[70,46],[90,46],[110,46],[130,46],[118,90],[138,90],[158,90],[178,90],[36,126],[56,126],[76,126],[104,150],[124,150],[144,150],[164,150],[20,80],[40,64],[216,64],[236,80],[230,120],[210,140],[60,100],[150,50],[180,70]] },
 { name:'GREEK', sky:'#7030a0', bezel:'#20d020', plat:'#30d030', ground:'#803010',
   platforms:[[16,70,50],[190,70,50],[60,110,44],[150,110,44],[170,150,50]],
   bombs:[[30,44],[58,32],[86,26],[114,24],[142,26],[170,32],[198,44],[64,104],[84,104],[104,104],[154,104],[174,104],[194,104],[40,144],[60,144],[180,144],[200,144],[30,170],[70,170],[110,170],[150,170],[190,170],[230,170]] },
 { name:'CASTLE', sky:'#b090e0', bezel:'#f0a020', plat:'#e0c020', ground:'#20a020',
   platforms:[[84,36,88],[84,100,88]],
   bombs:[[12,32],[12,52],[12,72],[12,92],[12,112],[12,132],[12,152],[244,32],[244,52],[244,72],[244,92],[244,112],[244,132],[244,152],[92,30],[112,30],[132,30],[152,30],[172,30],[104,94],[132,94],[160,94],[100,170],[156,170]] },
 { name:'SKYSCRAPER', sky:'#1050d0', bezel:'#e0d010', plat:'#e0c020', ground:'#1030a0',
   platforms:[[36,36,56],[164,36,56],[36,140,56],[164,140,56]],
   bombs:[[44,30],[64,30],[84,30],[172,30],[192,30],[212,30],[44,134],[64,134],[84,134],[172,134],[192,134],[212,134],[100,70],[120,50],[140,70],[120,90],[80,100],[176,100],[120,140],[30,170],[70,170],[120,170],[170,170],[210,170]] },
 { name:'NIGHT', sky:'#101040', bezel:'#30c0e0', plat:'#30c0e0', ground:'#30a030',
   platforms:[],
   bombs:[[60,40],[110,40],[160,40],[210,40],[60,60],[110,60],[160,60],[210,60],[40,90],[80,80],[120,80],[160,80],[200,90],[240,90],[24,160],[60,160],[96,160],[132,160],[168,160],[204,160],[232,160],[36,120],[120,120],[200,120]] },
];

<script>
// ================= CANVAS + VIEW ================================================
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
let VW = 0, VH = 0, SC = 1, OX = 0, OY = 0;
function fit() {
  VW = window.innerWidth; VH = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // uniform scale + letterbox: no aspect distortion
  SC = Math.min(VW / (CFG.W + CFG.FRAME * 2), VH / (CFG.H + CFG.FRAME * 2));
  OX = (VW - (CFG.W + CFG.FRAME * 2) * SC) / 2;
  OY = (VH - (CFG.H + CFG.FRAME * 2) * SC) / 2;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left - OX) / SC;
  const sy = (e.clientY - r.top - OY) / SC;
  return { x: sx - CFG.FRAME, y: sy - CFG.FRAME };
}
// ================= GAME STATE ==================================================
const ST = { TITLE: 0, PLAY: 1, ROUNDCLEAR: 2, GAMEOVER: 3, INITIALS: 4 };
const G = {
  st: ST.TITLE, score: 0, hi: +(localStorage.getItem('bj_hi') || 0), initials: localStorage.getItem('bj_init') || 'AAA',
  lives: CFG.LIVES, round: 1, screenIdx: 0, mult: 1,
  nextLifeAt: CFG.EXTRA_AT, freeze: 0, touchKill: 0,
  litCount: 0, litThisRound: 0, bombsGot: 0, litBonusNext: 10000,
  meter: 0, spawnT: 150, elapsed: 0, deadT: 0, clearT: 0,
  bombs: [], enemies: [], coins: [], powerups: [], pops: [],
  plat: [], platTop: new Map(),
  keys: {}, jumpHeld: false, jumpQueued: 0, glide: false,
  steerX: 0, steerY: 0,
  stick: null, jumpPtr: null,
  msg: '', msgT: 0, shake: 0,
};
const P = { x: 128, y: CFG.GROUND_Y - CFG.PLAYER_H, vy: 0, vx: 0, face: 1,
  grounded: true, jumping: false, glide: false, dead: false, invuln: 90, anim: 0 };
function rectHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function setScreen(idx) {
  const s = SCREENS[idx];
  G.screenIdx = idx;
  G.plat = s.platforms.map(p => ({ x: p[0], y: p[1], w: p[2] }));
  G.platTop = new Map();
  for (const pl of G.plat) for (let i = 0; i < pl.w; i++) G.platTop.set(pl.x + i, pl.y);
  G.bombs = s.bombs.map(b => ({ x: b[0], y: b[1], lit: false, pat: Math.random() * 6.28, got: false }));
  G.bombsGot = 0; G.litThisRound = 0; G.litCount = 0; G.litBonusNext = 10000;
  G.meter = 0; G.spawnT = Math.max(50, 170 - idx * 20); G.elapsed = 0; G.freeze = 0; G.touchKill = 0;
  G.enemies = []; G.coins = []; G.powerups = []; G.pops = [];
  P.x = 124; P.y = CFG.GROUND_Y - CFG.PLAYER_H; P.vx = 0; P.vy = 0;
  P.grounded = true; P.dead = false; P.jumping = false; P.glide = false; P.invuln = 60; P.face = 1;
  G.steerX = 0; G.steerY = 0; G.jumpHeld = false; G.jumpQueued = 0; G.glide = false;
}
function addPop(x, y, txt, col) { G.pops.push({ x, y, txt, col: col || '#fff', t: 45 }); }
function newGame() {
  G.score = 0; G.lives = CFG.LIVES; G.round = 1; G.mult = 1; G.nextLifeAt = CFG.EXTRA_AT;
  G.st = ST.PLAY; setScreen(0);
  musicStart();
}
function addScore(n) {
  G.score += n;
  while (G.score >= G.nextLifeAt) { G.nextLifeAt += CFG.EXTRA_AT; G.lives++; addPop(P.x, P.y - 8, '1UP', '#40ff40'); }
}
// ================= INPUT (zones per CONTROLS.md v2) ============================
const IN = { sx: 0, sy: 0, jump: false, jumpQ: 0 };
function zoneOf(e) {
  const l = toLogical(e);
  return l.x < CFG.W * 0.45 ? 'L' : 'R';
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  const z = zoneOf(e);
  if (z === 'L' && !G.stick) G.stick = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
  else if (z === 'R' && G.st !== ST.TITLE && G.st !== ST.GAMEOVER) {
    G.jumpPtr = e.pointerId; G.jumpHeld = true; G.jumpQueued++;
  } else if ((z === 'R' || z === 'L') && (G.st === ST.TITLE || G.st === ST.GAMEOVER)) {
    G.jumpPtr = e.pointerId; G.jumpHeld = true; G.jumpQueued++;
  }
});
cv.addEventListener('pointermove', e => {
  if (G.stick && e.pointerId === G.stick.id) {
    let dx = e.clientX - G.stick.sx, dy = e.clientY - G.stick.sy;
    const m = Math.hypot(dx, dy);
    if (m > 80) { dx = dx / m * 80; dy = dy / m * 80; }
    G.stick.dx = dx; G.stick.dy = dy;
  }
});
function ptrUp(e) {
  if (G.stick && e.pointerId === G.stick.id) G.stick = null;
  if (G.jumpPtr === e.pointerId) { G.jumpPtr = null; G.jumpHeld = false; }
}
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  G.keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space') { G.jumpHeld = true; G.jumpQueued++; }
  if (e.code === 'Enter' && (G.st === ST.TITLE || G.st === ST.GAMEOVER)) G.jumpQueued++;
});
window.addEventListener('keyup', e => {
  G.keys[e.code] = false;
  if (e.code === 'Space') G.jumpHeld = false;
});
function sampleInput() {
  let sx = 0, sy = 0;
  if (G.stick) {
    const d = G.stick.dx;
    sx = Math.abs(d) < CFG.DEAD_PX ? 0 : Math.max(-1, Math.min(1, (d - Math.sign(d) * CFG.DEAD_PX) / (CFG.FULL_PX - CFG.DEAD_PX)));
    const v = G.stick.dy;
    sy = Math.abs(v) < CFG.DEAD_PX ? 0 : Math.max(-1, Math.min(1, (v - Math.sign(v) * CFG.DEAD_PX) / (CFG.FULL_PX - CFG.DEAD_PX)));
  }
  if (G.keys['ArrowLeft']) sx = Math.min(sx, -1);
  if (G.keys['ArrowRight']) sx = Math.max(sx, 1);
  if (G.keys['ArrowUp']) sy = Math.min(sy, -1);
  if (G.keys['ArrowDown']) sy = Math.max(sy, 1);
  IN.sx = sx; IN.sy = sy;
}
// ================= PLAYER PHYSICS ==============================================
function playerStep() {
  if (P.dead) return;
  const target = IN.sx * CFG.RUN;
  P.vx += (target - P.vx) * (P.grounded ? 0.5 : 0.22);
  if (Math.abs(P.vx) > 0.05) P.face = P.vx > 0 ? 1 : -1;
  P.anim += Math.abs(P.vx) * 0.22;
  if (G.jumpQueued > 0) {
    G.jumpQueued = 0;
    if (P.grounded) {
      P.vy = -CFG.JUMP_V; P.grounded = false; P.jumping = true; P.glide = false;
      addScore(10);
    } else if (P.vy > -1.2) { P.glide = true; }
  }
  if (!P.grounded) {
    P.vy += CFG.GRAV;
    if (P.vy < 0 && G.jumpHeld) P.vy -= CFG.JUMP_HOLD;
    if (P.vy > 0 && G.jumpHeld && !P.glide) P.vy *= CFG.JUMP_CUT;
    if (P.vy > 0 && (P.glide || IN.sy < -0.3)) P.vy = Math.min(P.vy, CFG.GLIDE_V);
    if (P.vy > 0 && IN.sy > 0.5) P.vy += CFG.FAST_FALL;
    if (P.vy > 5) P.vy = 5;
  }
  P.x += P.vx;
  if (P.x < 2) { P.x = 2; P.vx = 0; }
  if (P.x + CFG.PLAYER_W > CFG.W - 2) { P.x = CFG.W - 2 - CFG.PLAYER_W; P.vx = 0; }
  const prevBottom = P.y + CFG.PLAYER_H;
  P.y += P.vy;
  P.grounded = false; P.glide = false;
  const col = (pl) => rectHit({ x: P.x + 1, y: P.y + 1, w: CFG.PLAYER_W - 2, h: CFG.PLAYER_H - 2 }, pl);
  if (P.vy >= 0) {
    if (prevBottom <= CFG.GROUND_Y + 1 && P.y + CFG.PLAYER_H >= CFG.GROUND_Y) {
      P.y = CFG.GROUND_Y - CFG.PLAYER_H; P.vy = 0; P.grounded = true; P.jumping = false;
    } else {
      for (const pl of G.plat) {
        const top = P.y + CFG.PLAYER_H;
        if (P.x + CFG.PLAYER_W - 2 > pl.x && P.x + 2 < pl.x + pl.w &&
            prevBottom <= pl.y + 1 && top >= pl.y) {
          P.y = pl.y - CFG.PLAYER_H; P.vy = 0; P.grounded = true; P.jumping = false;
          break;
        }
      }
    }
  } else {
    for (const pl of G.plat) {
      const bot = P.y;
      if (col(pl) && prevBottom - P.vy >= pl.y + pl.h) {
        P.y = pl.y + pl.h; P.vy = 0; break;
      }
    }
  }
  if (P.invuln > 0) P.invuln--;
}
function playerDie() {
  if (P.invuln > 0 || P.dead) return;
  P.dead = true; G.deadT = 90; G.shake = 8;
  haptic('heavy');
}
function respawn() {
  P.x = 124; P.y = CFG.GROUND_Y - CFG.PLAYER_H;
  P.vx = 0; P.vy = 0; P.dead = false; P.grounded = true; P.invuln = 120;
}
</script>
<script>
// ================= BOMBS =======================================================
// Only 1-2 lit bombs move at a time (user: not all over the place).
// Others light up in place (black) but stay fixed.
const LIT_MOVERS = 2;
function bombStep() {
  const active = G.bombs.filter(b => !b.got);
  if (G.bombsGot > 0) {
    // sequence started: remaining bombs light one per 45 ticks
    G.litTimer = (G.litTimer || 0) + 1;
    if (G.litTimer >= 45) {
      G.litTimer = 0;
      for (const b of active) { if (!b.lit) { b.lit = true; break; } }
    }
  }
  // designate at most LIT_MOVERS lit bombs as movers (the most recently lit)
  const litActive = active.filter(b => b.lit);
  for (const b of litActive) b.mover = false;
  for (let i = Math.max(0, litActive.length - LIT_MOVERS); i < litActive.length; i++) litActive[i].mover = true;
  for (const b of active) {
    if (b.lit && b.mover) {
      b.pat = (b.pat || 0) + 0.012;            // slow drift
      b.x += Math.cos(b.pat) * 0.035;
    }
  }
  // pickup
  const pb = { x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H };
  for (const b of G.bombs) {
    if (b.got) continue;
    if (rectHit(pb, { x: b.x - 5, y: b.y - 5, w: 10, h: 10 })) {
      b.got = true; G.bombsGot++;
      const pts = (b.lit ? 200 : 100) * G.mult;
      addScore(pts);
      addPop(b.x, b.y, '' + pts, b.lit ? '#000' : '#f04040');
      G.meter += b.lit ? 2 : 1;
      if (b.lit) { G.litThisRound++; }
      if (G.meter >= 10) { G.meter = 0; spawnPowerup(); }
      haptic('light');
    }
  }
  if (G.st === ST.PLAY && G.bombsGot >= 24) roundClear();
}
function roundClear() {
  let bonus = 0;
  if (G.litThisRound === 20) bonus = 10000;
  else if (G.litThisRound === 21) bonus = 20000;
  else if (G.litThisRound === 22) bonus = 30000;
  else if (G.litThisRound >= 23) bonus = 50000;
  addScore(bonus);
  G.st = ST.ROUNDCLEAR; G.clearT = 120;
  haptic('success');
}
// ================= POWERUPS ====================================================
const PU_LETTERS = ['P', 'B', 'E', 'S'];
function spawnPowerup() {
  const r = Math.random();
  let L = r < 0.34 ? 'P' : r < 0.62 ? 'B' : r < 0.86 ? 'E' : 'S';
  // spawn within play area, above ground, below top HUD
  G.powerups.push({ x: 6 + Math.random() * (CFG.W - 12), y: 30 + Math.random() * 70, L, vx: 0.35, t: 0 });
}
function powerupStep() {
  for (const pu of G.powerups) {
    pu.t++; pu.x += pu.vx;
    if (pu.x > CFG.W - 8) { pu.x = CFG.W - 8; pu.vx *= -1; }
    if (pu.x < 8) { pu.x = 8; pu.vx *= -1; }
    if (pu.y < 28) pu.y = 28;
    if (pu.y > CFG.GROUND_Y - 8) pu.y = CFG.GROUND_Y - 8;
    if (pu.t > 900) pu.dead = true;
    if (!pu.dead && !P.dead &&
        rectHit({ x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H }, { x: pu.x - 7, y: pu.y - 7, w: 14, h: 14 })) {
      pu.dead = true;
      const pts = 1000 * G.mult;
      addScore(pts);
      addPop(pu.x, pu.y, '' + pts, '#40f0f0');
      if (pu.L === 'P') {
        G.freeze = 300;
        for (const e of G.enemies) if (!e.frozen) { e.frozen = true; e.coin = true; }
      } else if (pu.L === 'B') {
        G.mult = Math.min(5, G.mult + 1);
        addPop(pu.x, pu.y + 10, 'x' + G.mult, '#f0f040');
        for (let i = 0; i < 5; i++) dropCoin(pu.x, pu.y);
      } else if (pu.L === 'E') {
        G.lives++;
        addPop(pu.x, pu.y + 10, '1UP', '#40ff40');
      } else if (pu.L === 'S') {
        G.touchKill = 240;
        addPop(pu.x, pu.y + 10, 'TOUCH KILL', '#ff40ff');
      }
      haptic('medium');
    }
  }
  G.powerups = G.powerups.filter(p => !p.dead);
}
function dropCoin(x, y) {
  const cols = [100, 300, 1000, 2000];
  const col = cols[Math.floor(Math.random() * cols.length)];
  G.coins.push({ x: x + (Math.random() - 0.5) * 24, y, vy: -1 - Math.random(), val: col, t: 0 });
}
function coinStep() {
  for (const c of G.coins) {
    c.t++; c.vy += 0.12; c.y += c.vy;
    if (c.y > CFG.GROUND_Y - 3) { c.y = CFG.GROUND_Y - 3; c.vy = 0; }
    if (c.t > 240) c.dead = true;
    if (!c.dead && !P.dead &&
        rectHit({ x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H }, { x: c.x - 4, y: c.y - 4, w: 8, h: 8 })) {
      c.dead = true;
      const pts = c.val * G.mult;
      addScore(pts);
      addPop(c.x, c.y, '' + pts, '#f0c020');
    }
  }
  G.coins = G.coins.filter(c => !c.dead);
}
// ================= ENEMIES =====================================================
const ETYPES = ['bird', 'mummy', 'ufo', 'orb'];
function spawnEnemy() {
  if (G.enemies.length >= 6) return;
  const t = G.screenIdx + Math.floor(G.round / 1);
  const type = ETYPES[Math.floor(Math.random() * Math.min(2 + G.screenIdx, 4))];
  const x = 20 + Math.random() * (CFG.W - 40);
  const speed = 0.4 + G.screenIdx * 0.12 + Math.min(0.4, G.elapsed / 24000);
  const e = { type, x, y: -14, vy: 0.6, t: 0, dir: 1, frozen: false, coin: false,
    morphT: 400 + Math.random() * 300, speed, baseY: 0, phase: Math.random() * 6.28 };
  G.enemies.push(e);
}
function enemyStep() {
  if (G.st === ST.PLAY && G.freeze <= 0) {
    G.spawnT--;
    if (G.spawnT <= 0) {
      spawnEnemy();
      const base = Math.max(35, 120 - G.screenIdx * 18 - Math.floor(G.elapsed / 900) * 5);
      G.spawnT = base + Math.random() * 40;
    }
  }
  for (const e of G.enemies) {
    e.t++;
    if (G.freeze > 0 && e.coin) {
      e.y += 0.5;
      if (e.y > CFG.GROUND_Y - 4) e.y = CFG.GROUND_Y - 4;
      if (rectHit({ x: P.x, y: P.y, w: CFG.PLAYER_W, h: CFG.PLAYER_H }, { x: e.x - 7, y: e.y - 7, w: 14, h: 14 })) {
        e.dead = true;
        const pts = (e.type === 'ufo' || e.type === 'orb' ? 1000 : 300) * G.mult;
        addScore(pts);
        addPop(e.x, e.y, '' + pts, '#f0c020');
        haptic('light');
      }
      continue;
    }

        else { e.type = Math.random() < 0.5 ? 'bird' : 'mummy'; }

      }

                  { x: e.x - 7, y: e.y - 7, w: 14, h: 14 })) {

          e.dead = true;
          addScore(500 * G.mult);
          addPop(e.x, e.y, '' + (500 * G.mult), '#ff40ff');
          haptic('light');
        } else {
          playerDie();
        }
      }

  if (G.freeze > 0) G.freeze--;
  if (G.touchKill > 0) G.touchKill--;
}

  { const c = mkCanvas(12, 10), g = c.getContext('2d');

function drawBG(s, t) {

    g.fillRect(180, 108, 10, 10);       // head
    g.fillRect(178, 106, 6, 4);         // headdress

    g.fillRect(200, 60, 24, 70); g.fillRect(196, 52, 32, 8);

  } else if (s.name === 'SKYSCRAPER') {
    g.fillStyle = '#2040a0';
    for (let i = 0; i < 6; i++) {

      g.fillStyle = '#f0e040';

  g.fillRect(0, CFG.GROUND_Y, CFG.W, 2);

  g.fillStyle = '#00000040';
  for (const p of G.plat) g.fillRect(p.x, p.y + 3, p.w, 1);

  }
  drawWorld();
  cx.restore();
  // steer stick visual (screen space, not scaled)
  if (G.stick) {
    cx.fillStyle = 'rgba(255,255,255,0.15)';
    cx.beginPath(); cx.arc(G.stick.sx, G.stick.sy, 30, 0, 6.29); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.4)';
    cx.beginPath(); cx.arc(G.stick.sx + G.stick.dx * 0.5, G.stick.sy + G.stick.dy * 0.5, 14, 0, 6.29); cx.fill();
  }
  // jump button (screen space)
  if (G.st !== ST.TITLE) {
    const bx = VW - 70, by = VH - 60;
    cx.fillStyle = G.jumpHeld ? 'rgba(240,240,64,0.35)' : 'rgba(255,255,255,0.12)';
    cx.beginPath(); cx.arc(bx, by, 34, 0, 6.29); cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,0.5)'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(bx, by, 34, 0, 6.29); cx.stroke();
    cx.fillStyle = 'rgba(255,255,255,0.8)'; cx.font = 'bold 11px monospace';
    cx.fillText('JUMP', bx - 15, by + 4);
  }
}
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 100) dt = 100;
  acc += dt;
  const step = 1000 / 60;
  while (acc >= step) { tick(); acc -= step; }
  render();
}
// ================= TELEGRAM + BOOT =============================================
function tgInit() {
  try {
    const W = Telegram && Telegram.WebApp;
    if (!W) return;
    W.ready(); W.expand();
    W.setHeaderColor('#000'); W.setBackgroundColor('#000');
    if (W.themeParams && W.themeParams.bg_color) {}
    const MB = W.MainButton;
    if (MB) {
      MB.onClick(() => { audioInit(); if (G.st === ST.TITLE) newGame(); });
      MB.show(); MB.setText('PLAY');
    }
  } catch (e) {}
}
window.addEventListener('load', () => {
  buildSprites();
  fit();
  tgInit();
  requestAnimationFrame(frame);
});
</script>
